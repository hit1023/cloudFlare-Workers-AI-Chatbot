<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workers AI Chatbot Sample</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #e0e2e6;
    --text: #1b1c1f;
    --muted: #6b7280;
    --accent: #f6821f; /* Cloudflare orange */
    --user-bubble: #f6821f;
    --user-text: #ffffff;
    --bot-bubble: #eef0f3;
    --bot-text: #1b1c1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #202127;
      --border: #33343b;
      --text: #f1f1f3;
      --muted: #9aa0aa;
      --bot-bubble: #2c2d34;
      --bot-text: #f1f1f3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 48px);
  }
  header {
    padding-bottom: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  .model-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .model-row select {
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    max-width: 320px;
  }
  #model-warning {
    margin: 4px 0 0;
    font-size: 12px;
    color: #d92d20;
  }
  #model-warning:empty {
    display: none;
  }
  .panel {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    color: var(--bot-text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: transparent;
    color: #d92d20;
    font-size: 13px;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    height: 42px;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Workers AI Chatbot Sample</h1>
      <div class="model-row">
        <label for="model-select">model:</label>
        <select id="model-select" disabled>
          <option>読み込み中...</option>
        </select>
      </div>
      <p id="model-warning"></p>
    </header>
    <div class="panel">
      <div id="log"></div>
      <form id="form">
        <textarea id="input" placeholder="メッセージを入力..." autofocus></textarea>
        <button id="send" type="submit">送信</button>
      </form>
    </div>
  </div>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const history = [];
  const modelSelect = document.getElementById("model-select");
  const modelWarning = document.getElementById("model-warning");

  async function loadModels() {
    try {
      const cfgRes = await fetch("/api/config");
      const cfg = await cfgRes.json();
      if (!cfg.configured) {
        modelWarning.textContent = "CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN が未設定です。app.envを確認してください。";
        modelSelect.innerHTML = "<option>" + cfg.model + "</option>";
        return;
      }

      const res = await fetch("/api/models");
      const data = await res.json();
      if (!res.ok) {
        modelWarning.textContent = data.error || "モデル一覧の取得に失敗しました。";
        modelSelect.innerHTML = "<option>" + cfg.model + "</option>";
        return;
      }

      modelSelect.innerHTML = "";
      for (const id of data.models) {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        if (id === data.default) opt.selected = true;
        modelSelect.appendChild(opt);
      }
      modelSelect.disabled = false;
    } catch (err) {
      modelWarning.textContent = "モデル一覧の取得に失敗しました: " + err.message;
    }
  }

  loadModels();

  function addBubble(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addBubble("user", text);
    history.push({ role: "user", content: text });
    input.value = "";
    sendBtn.disabled = true;

    const pending = addBubble("bot", "…");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, model: modelSelect.value }),
      });
      const data = await res.json();

      if (!res.ok) {
        pending.remove();
        addBubble("error", data.error || "エラーが発生しました。");
      } else {
        pending.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (err) {
      pending.remove();
      addBubble("error", "通信に失敗しました: " + err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
